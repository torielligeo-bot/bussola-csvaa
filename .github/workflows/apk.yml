name: Compila app Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compila e firma l'APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/release/app-release.apk Bussola-CSVAA.apk

      - name: Pubblica la versione
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bussola CSVAA 1.0.${{ github.run_number }}
          make_latest: true
          files: Bussola-CSVAA.apk
          body: |
            App Android di Bussola CSVAA (prototipo non ufficiale).
            Scarica Bussola-CSVAA.apk sul telefono, aprilo e conferma l'installazione.
            Link sempre aggiornato: https://github.com/${{ github.repository }}/releases/latest/download/Bussola-CSVAA.apk
